<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#2D1B0E" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="OBRIZ" />
  <meta name="description" content="OBRIZ — Luxury Nervous System Wellness. Precision regulation for the woman who runs everything." />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="msapplication-TileColor" content="#2D1B0E" />
  <meta name="msapplication-navbutton-color" content="#2D1B0E" />
  <meta property="og:title" content="OBRIZ — Nervous System Wellness" />
  <meta property="og:description" content="Precision nervous system regulation for the woman who runs everything." />
  <meta property="og:type" content="website" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="apple-touch-icon" href="/icon-192.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
  <link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png" />
  <!-- iOS splash screens — generic fallback -->
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>OBRIZ — Nervous System Wellness</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body, #root { width: 100%; height: 100%; background: #2D1B0E; overflow-x: hidden; }
    body { -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
    @media (display-mode: standalone) {
      body { padding-top: env(safe-area-inset-top); }
    }
    /* Splash / loading state before React hydrates */
    #root:empty {
      display: flex; align-items: center; justify-content: center;
    }
    #root:empty::after {
      content: 'OBRIZ';
      font-family: Georgia, 'Times New Roman', serif;
      font-size: 2.4rem;
      letter-spacing: 0.25em;
      color: #C49A4B;
      animation: pulse 1.8s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 0.3; }
      50% { opacity: 1; }
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js').catch(() => {});
      });
    }
  </script>
</body>
</html>
