<svg viewBox="0 0 300 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .label-text { font-family: 'Helvetica Neue', sans-serif; font-size: 11px; fill: #C49A4B; text-anchor: middle; dominant-baseline: middle; }
      .label-small { font-family: 'Helvetica Neue', sans-serif; font-size: 9px; fill: #C49A4B; text-anchor: middle; }
    </style>
    <marker id="liftarrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#C49A4B"/>
    </marker>
  </defs>

  <!-- Face outline -->
  <ellipse cx="150" cy="160" rx="65" ry="95" fill="none" stroke="#C49A4B" stroke-width="1.5"/>

  <!-- Ears -->
  <ellipse cx="87" cy="150" rx="12" ry="28" fill="none" stroke="#C49A4B" stroke-width="1.5"/>
  <path d="M 92 155 Q 98 160 95 170" fill="none" stroke="#C49A4B" stroke-width="1"/>
  <ellipse cx="213" cy="150" rx="12" ry="28" fill="none" stroke="#C49A4B" stroke-width="1.5"/>
  <path d="M 208 155 Q 202 160 205 170" fill="none" stroke="#C49A4B" stroke-width="1"/>

  <!-- Eyes -->
  <path d="M 125 130 Q 135 135 145 130" fill="none" stroke="#C49A4B" stroke-width="1.5" stroke-linecap="round"/>
  <circle cx="135" cy="132" r="2" fill="#C49A4B"/>
  <path d="M 155 130 Q 165 135 175 130" fill="none" stroke="#C49A4B" stroke-width="1.5" stroke-linecap="round"/>
  <circle cx="165" cy="132" r="2" fill="#C49A4B"/>

  <!-- Eyebrows -->
  <path d="M 120 115 Q 135 110 145 115" fill="none" stroke="#C49A4B" stroke-width="1" stroke-linecap="round"/>
  <path d="M 155 115 Q 165 110 180 115" fill="none" stroke="#C49A4B" stroke-width="1" stroke-linecap="round"/>

  <!-- Nose -->
  <line x1="150" y1="135" x2="150" y2="160" stroke="#C49A4B" stroke-width="1"/>
  <path d="M 148 160 Q 148 162 150 163" fill="none" stroke="#C49A4B" stroke-width="1"/>
  <path d="M 152 160 Q 152 162 150 163" fill="none" stroke="#C49A4B" stroke-width="1"/>

  <!-- Lips -->
  <path d="M 130 190 Q 150 205 170 190" fill="none" stroke="#C49A4B" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M 130 190 Q 150 200 170 190" fill="none" stroke="#C49A4B" stroke-width="1" stroke-linecap="round"/>

  <!-- Cheekbone definition lines -->
  <path d="M 110 155 Q 120 165 130 175" fill="none" stroke="#C49A4B" stroke-width="0.8" opacity="0.6"/>
  <path d="M 190 155 Q 180 165 170 175" fill="none" stroke="#C49A4B" stroke-width="0.8" opacity="0.6"/>

  <!-- LIFTING POINTS AND DIRECTIONS -->

  <!-- JAWLINE LIFTING POINTS -->
  <!-- Left jawline point 1 (lower jaw) -->
  <g id="jawline-left-1">
    <circle cx="115" cy="205" r="6" fill="none" stroke="#C49A4B" stroke-width="1.5"/>
    <circle cx="115" cy="205" r="3" fill="#C49A4B"/>
    <!-- Upward lifting arrow -->
    <path d="M 115 198 L 115 180" stroke="#C49A4B" stroke-width="1.2" fill="none" marker-end="url(#liftarrow)"/>
    <text x="105" y="220" class="label-small">J1</text>
  </g>

  <!-- Center jawline point -->
  <g id="jawline-center">
    <circle cx="150" cy="220" r="6" fill="none" stroke="#C49A4B" stroke-width="1.5"/>
    <circle cx="150" cy="220" r="3" fill="#C49A4B"/>
    <!-- Upward lifting arrow -->
    <path d="M 150 213 L 150 185" stroke="#C49A4B" stroke-width="1.2" fill="none" marker-end="url(#liftarrow)"/>
    <text x="150" y="240" class="label-small">J2</text>
  </g>

  <!-- Right jawline point 1 (lower jaw) -->
  <g id="jawline-right-1">
    <circle cx="185" cy="205" r="6" fill="none" stroke="#C49A4B" stroke-width="1.5"/>
    <circle cx="185" cy="205" r="3" fill="#C49A4B"/>
    <!-- Upward lifting arrow -->
    <path d="M 185 198 L 185 180" stroke="#C49A4B" stroke-width="1.2" fill="none" marker-end="url(#liftarrow)"/>
    <text x="195" y="220" class="label-small">J1</text>
  </g>

  <!-- Upper jawline/marionette line points -->
  <!-- Left marionette line -->
  <g id="marionette-left">
    <circle cx="125" cy="190" r="6" fill="none" stroke="#C49A4B" stroke-width="1.5"/>
    <circle cx="125" cy="190" r="3" fill="#C49A4B"/>
    <!-- Diagonal upward-outward lifting arrow -->
    <path d="M 129 185 L 145 165" stroke="#C49A4B" stroke-width="1.2" fill="none" marker-end="url(#liftarrow)"/>
    <text x="110" y="195" class="label-small">M1</text>
  </g>

  <!-- Right marionette line -->
  <g id="marionette-right">
    <circle cx="175" cy="190" r="6" fill="none" stroke="#C49A4B" stroke-width="1.5"/>
    <circle cx="175" cy="190" r="3" fill="#C49A4B"/>
    <!-- Diagonal upward-outward lifting arrow -->
    <path d="M 171 185 L 155 165" stroke="#C49A4B" stroke-width="1.2" fill="none" marker-end="url(#liftarrow)"/>
    <text x="190" y="195" class="label-small">M1</text>
  </g>

  <!-- NASOLABIAL FOLD POINTS -->
  <!-- Left nasolabial fold -->
  <g id="nasolabial-left">
    <circle cx="135" cy="175" r="6" fill="none" stroke="#C49A4B" stroke-width="1.5"/>
    <circle cx="135" cy="175" r="3" fill="#C49A4B"/>
    <!-- Upward-outward lifting arrow -->
    <path d="M 138 170 L 150 150" stroke="#C49A4B" stroke-width="1.2" fill="none" marker-end="url(#liftarrow)"/>
    <text x="120" y="175" class="label-small">NF</text>
  </g>

  <!-- Right nasolabial fold -->
  <g id="nasolabial-right">
    <circle cx="165" cy="175" r="6" fill="none" stroke="#C49A4B" stroke-width="1.5"/>
    <circle cx="165" cy="175" r="3" fill="#C49A4B"/>
    <!-- Upward-outward lifting arrow -->
    <path d="M 162 170 L 150 150" stroke="#C49A4B" stroke-width="1.2" fill="none" marker-end="url(#liftarrow)"/>
    <text x="180" y="175" class="label-small">NF</text>
  </g>

  <!-- BROW AREA LIFTING POINTS -->
  <!-- Left inner brow -->
  <g id="brow-inner-left">
    <circle cx="130" cy="115" r="6" fill="none" stroke="#C49A4B" stroke-width="1.5"/>
    <circle cx="130" cy="115" r="3" fill="#C49A4B"/>
    <!-- Upward lifting arrow -->
    <path d="M 130 108 L 130 90" stroke="#C49A4B" stroke-width="1.2" fill="none" marker-end="url(#liftarrow)"/>
    <text x="120" y="105" class="label-small">B1</text>
  </g>

  <!-- Center brow -->
  <g id="brow-center">
    <circle cx="150" cy="110" r="6" fill="none" stroke="#C49A4B" stroke-width="1.5"/>
    <circle cx="150" cy="110" r="3" fill="#C49A4B"/>
    <!-- Upward lifting arrow -->
    <path d="M 150 103 L 150 80" stroke="#C49A4B" stroke-width="1.2" fill="none" marker-end="url(#liftarrow)"/>
    <text x="150" y="95" class="label-small">B2</text>
  </g>

  <!-- Right inner brow -->
  <g id="brow-inner-right">
    <circle cx="170" cy="115" r="6" fill="none" stroke="#C49A4B" stroke-width="1.5"/>
    <circle cx="170" cy="115" r="3" fill="#C49A4B"/>
    <!-- Upward lifting arrow -->
    <path d="M 170 108 L 170 90" stroke="#C49A4B" stroke-width="1.2" fill="none" marker-end="url(#liftarrow)"/>
    <text x="180" y="105" class="label-small">B1</text>
  </g>

  <!-- Outer brow area (temple-adjacent) -->
  <!-- Left outer brow -->
  <g id="brow-outer-left">
    <circle cx="110" cy="120" r="6" fill="none" stroke="#C49A4B" stroke-width="1.5"/>
    <circle cx="110" cy="120" r="3" fill="#C49A4B"/>
    <!-- Diagonal upward-outward lifting arrow -->
    <path d="M 114 117 L 135 95" stroke="#C49A4B" stroke-width="1.2" fill="none" marker-end="url(#liftarrow)"/>
    <text x="95" y="115" class="label-small">B3</text>
  </g>

  <!-- Right outer brow -->
  <g id="brow-outer-right">
    <circle cx="190" cy="120" r="6" fill="none" stroke="#C49A4B" stroke-width="1.5"/>
    <circle cx="190" cy="120" r="3" fill="#C49A4B"/>
    <!-- Diagonal upward-outward lifting arrow -->
    <path d="M 186 117 L 165 95" stroke="#C49A4B" stroke-width="1.2" fill="none" marker-end="url(#liftarrow)"/>
    <text x="205" y="115" class="label-small">B3</text>
  </g>

  <!-- TEMPLE LIFTING POINTS -->
  <!-- Left temple -->
  <g id="temple-left">
    <circle cx="100" cy="145" r="6" fill="none" stroke="#C49A4B" stroke-width="1.5"/>
    <circle cx="100" cy="145" r="3" fill="#C49A4B"/>
    <!-- Upward-outward diagonal lifting arrow -->
    <path d="M 104 141 L 120 120" stroke="#C49A4B" stroke-width="1.2" fill="none" marker-end="url(#liftarrow)"/>
    <text x="85" y="145" class="label-small">T</text>
  </g>

  <!-- Right temple -->
  <g id="temple-right">
    <circle cx="200" cy="145" r="6" fill="none" stroke="#C49A4B" stroke-width="1.5"/>
    <circle cx="200" cy="145" r="3" fill="#C49A4B"/>
    <!-- Upward-outward diagonal lifting arrow -->
    <path d="M 196 141 L 180 120" stroke="#C49A4B" stroke-width="1.2" fill="none" marker-end="url(#liftarrow)"/>
    <text x="215" y="145" class="label-small">T</text>
  </g>

  <!-- Legend -->
  <text x="150" y="365" class="label-text" font-size="10" opacity="0.7">Golden circles mark lifting points | Arrows show upward lifting direction</text>
  <text x="150" y="380" class="label-text" font-size="9" opacity="0.6">J = Jawline | M = Marionette | NF = Nasolabial Fold | B = Brow | T = Temple</text>
</svg>