<svg viewBox="0 0 300 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .zone-label { font-family: 'Helvetica Neue', sans-serif; font-size: 12px; font-weight: 600; fill: #C49A4B; text-anchor: middle; }
      .zone-number { font-family: 'Helvetica Neue', sans-serif; font-size: 10px; font-weight: bold; fill: #F2E8D9; text-anchor: middle; dominant-baseline: middle; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#C49A4B"/>
    </marker>
  </defs>

  <!-- Face outline -->
  <ellipse cx="150" cy="160" rx="65" ry="95" fill="none" stroke="#C49A4B" stroke-width="1.5"/>

  <!-- Ears -->
  <ellipse cx="87" cy="150" rx="12" ry="28" fill="none" stroke="#C49A4B" stroke-width="1.5"/>
  <path d="M 92 155 Q 98 160 95 170" fill="none" stroke="#C49A4B" stroke-width="1"/>
  <ellipse cx="213" cy="150" rx="12" ry="28" fill="none" stroke="#C49A4B" stroke-width="1.5"/>
  <path d="M 208 155 Q 202 160 205 170" fill="none" stroke="#C49A4B" stroke-width="1"/>

  <!-- Eyes -->
  <path d="M 125 130 Q 135 135 145 130" fill="none" stroke="#C49A4B" stroke-width="1.5" stroke-linecap="round"/>
  <circle cx="135" cy="132" r="2" fill="#C49A4B"/>
  <path d="M 155 130 Q 165 135 175 130" fill="none" stroke="#C49A4B" stroke-width="1.5" stroke-linecap="round"/>
  <circle cx="165" cy="132" r="2" fill="#C49A4B"/>

  <!-- Eyebrows -->
  <path d="M 120 115 Q 135 110 145 115" fill="none" stroke="#C49A4B" stroke-width="1" stroke-linecap="round"/>
  <path d="M 155 115 Q 165 110 180 115" fill="none" stroke="#C49A4B" stroke-width="1" stroke-linecap="round"/>

  <!-- Nose -->
  <line x1="150" y1="135" x2="150" y2="160" stroke="#C49A4B" stroke-width="1"/>
  <path d="M 148 160 Q 148 162 150 163" fill="none" stroke="#C49A4B" stroke-width="1"/>
  <path d="M 152 160 Q 152 162 150 163" fill="none" stroke="#C49A4B" stroke-width="1"/>

  <!-- Lips -->
  <path d="M 130 190 Q 150 205 170 190" fill="none" stroke="#C49A4B" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M 130 190 Q 150 200 170 190" fill="none" stroke="#C49A4B" stroke-width="1" stroke-linecap="round"/>

  <!-- ZONE 1: JAWLINE - arrows sweeping outward from chin -->
  <g id="zone-1">
    <!-- Left jawline stroke path (dotted) -->
    <path d="M 150 210 Q 125 220 105 215" fill="none" stroke="#C49A4B" stroke-width="1.2" stroke-dasharray="3,2" opacity="0.7"/>
    <!-- Right jawline stroke path (dotted) -->
    <path d="M 150 210 Q 175 220 195 215" fill="none" stroke="#C49A4B" stroke-width="1.2" stroke-dasharray="3,2" opacity="0.7"/>

    <!-- Left jawline arrows -->
    <path d="M 135 215 L 120 220" stroke="#C49A4B" stroke-width="1" fill="none" marker-end="url(#arrowhead)"/>
    <path d="M 145 220 L 125 228" stroke="#C49A4B" stroke-width="1" fill="none" marker-end="url(#arrowhead)"/>

    <!-- Right jawline arrows -->
    <path d="M 165 215 L 180 220" stroke="#C49A4B" stroke-width="1" fill="none" marker-end="url(#arrowhead)"/>
    <path d="M 155 220 L 175 228" stroke="#C49A4B" stroke-width="1" fill="none" marker-end="url(#arrowhead)"/>

    <!-- Zone 1 label circle and number -->
    <circle cx="150" cy="245" r="12" fill="none" stroke="#C49A4B" stroke-width="1"/>
    <text x="150" y="248" class="zone-number">1</text>
  </g>

  <!-- ZONE 2: CHEEKS - arrows sweeping upward and outward -->
  <g id="zone-2">
    <!-- Left cheek stroke path (dotted) -->
    <path d="M 130 165 Q 115 155 110 140" fill="none" stroke="#C49A4B" stroke-width="1.2" stroke-dasharray="3,2" opacity="0.7"/>
    <!-- Right cheek stroke path (dotted) -->
    <path d="M 170 165 Q 185 155 190 140" fill="none" stroke="#C49A4B" stroke-width="1.2" stroke-dasharray="3,2" opacity="0.7"/>

    <!-- Left cheek arrows -->
    <path d="M 128 170 L 112 160" stroke="#C49A4B" stroke-width="1" fill="none" marker-end="url(#arrowhead)"/>
    <path d="M 125 160 L 108 148" stroke="#C49A4B" stroke-width="1" fill="none" marker-end="url(#arrowhead)"/>

    <!-- Right cheek arrows -->
    <path d="M 172 170 L 188 160" stroke="#C49A4B" stroke-width="1" fill="none" marker-end="url(#arrowhead)"/>
    <path d="M 175 160 L 192 148" stroke="#C49A4B" stroke-width="1" fill="none" marker-end="url(#arrowhead)"/>

    <!-- Zone 2 label circles and number -->
    <circle cx="105" cy="125" r="12" fill="none" stroke="#C49A4B" stroke-width="1"/>
    <text x="105" y="128" class="zone-number">2</text>
    <circle cx="195" cy="125" r="12" fill="none" stroke="#C49A4B" stroke-width="1"/>
    <text x="195" y="128" class="zone-number">2</text>
  </g>

  <!-- ZONE 3: UNDER-EYE - gentle arrows outward -->
  <g id="zone-3">
    <!-- Left under-eye stroke path (dotted) -->
    <path d="M 140 140 Q 125 138 115 140" fill="none" stroke="#C49A4B" stroke-width="1.2" stroke-dasharray="3,2" opacity="0.7"/>
    <!-- Right under-eye stroke path (dotted) -->
    <path d="M 160 140 Q 175 138 185 140" fill="none" stroke="#C49A4B" stroke-width="1.2" stroke-dasharray="3,2" opacity="0.7"/>

    <!-- Left under-eye arrow -->
    <path d="M 135 138 L 115 140" stroke="#C49A4B" stroke-width="1" fill="none" marker-end="url(#arrowhead)"/>

    <!-- Right under-eye arrow -->
    <path d="M 165 138 L 185 140" stroke="#C49A4B" stroke-width="1" fill="none" marker-end="url(#arrowhead)"/>

    <!-- Zone 3 label circles -->
    <circle cx="110" cy="148" r="10" fill="none" stroke="#C49A4B" stroke-width="1"/>
    <text x="110" y="151" class="zone-number" font-size="9">3</text>
    <circle cx="190" cy="148" r="10" fill="none" stroke="#C49A4B" stroke-width="1"/>
    <text x="190" y="151" class="zone-number" font-size="9">3</text>
  </g>

  <!-- ZONE 4: FOREHEAD - arrows sweeping upward -->
  <g id="zone-4">
    <!-- Center forehead stroke path (dotted) -->
    <path d="M 150 115 L 150 90" fill="none" stroke="#C49A4B" stroke-width="1.2" stroke-dasharray="3,2" opacity="0.7"/>

    <!-- Left forehead arrows -->
    <path d="M 140 115 L 138 95" stroke="#C49A4B" stroke-width="1" fill="none" marker-end="url(#arrowhead)"/>
    <path d="M 130 110 L 128 88" stroke="#C49A4B" stroke-width="1" fill="none" marker-end="url(#arrowhead)"/>

    <!-- Right forehead arrows -->
    <path d="M 160 115 L 162 95" stroke="#C49A4B" stroke-width="1" fill="none" marker-end="url(#arrowhead)"/>
    <path d="M 170 110 L 172 88" stroke="#C49A4B" stroke-width="1" fill="none" marker-end="url(#arrowhead)"/>

    <!-- Zone 4 label circle -->
    <circle cx="150" cy="75" r="12" fill="none" stroke="#C49A4B" stroke-width="1"/>
    <text x="150" y="78" class="zone-number">4</text>
  </g>

  <!-- ZONE 5: BROW BONE - arrows outward -->
  <g id="zone-5">
    <!-- Left brow stroke path (dotted) -->
    <path d="M 135 115 Q 120 110 105 110" fill="none" stroke="#C49A4B" stroke-width="1.2" stroke-dasharray="3,2" opacity="0.7"/>
    <!-- Right brow stroke path (dotted) -->
    <path d="M 165 115 Q 180 110 195 110" fill="none" stroke="#C49A4B" stroke-width="1.2" stroke-dasharray="3,2" opacity="0.7"/>

    <!-- Left brow arrow -->
    <path d="M 128 112 L 108 110" stroke="#C49A4B" stroke-width="1" fill="none" marker-end="url(#arrowhead)"/>

    <!-- Right brow arrow -->
    <path d="M 172 112 L 192 110" stroke="#C49A4B" stroke-width="1" fill="none" marker-end="url(#arrowhead)"/>

    <!-- Zone 5 label circles -->
    <circle cx="100" cy="105" r="10" fill="none" stroke="#C49A4B" stroke-width="1"/>
    <text x="100" y="108" class="zone-number" font-size="9">5</text>
    <circle cx="200" cy="105" r="10" fill="none" stroke="#C49A4B" stroke-width="1"/>
    <text x="200" y="108" class="zone-number" font-size="9">5</text>
  </g>

  <!-- Cheekbone definition lines -->
  <path d="M 110 155 Q 120 165 130 175" fill="none" stroke="#C49A4B" stroke-width="0.8" opacity="0.6"/>
  <path d="M 190 155 Q 180 165 170 175" fill="none" stroke="#C49A4B" stroke-width="0.8" opacity="0.6"/>
</svg>