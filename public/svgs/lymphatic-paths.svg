<svg viewBox="0 0 300 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .label-text { font-family: 'Helvetica Neue', sans-serif; font-size: 11px; fill: #C49A4B; text-anchor: middle; }
    </style>
  </defs>

  <!-- Face outline -->
  <ellipse cx="150" cy="160" rx="65" ry="95" fill="none" stroke="#C49A4B" stroke-width="1.5"/>

  <!-- Ears -->
  <ellipse cx="87" cy="150" rx="12" ry="28" fill="none" stroke="#C49A4B" stroke-width="1.5"/>
  <path d="M 92 155 Q 98 160 95 170" fill="none" stroke="#C49A4B" stroke-width="1"/>
  <ellipse cx="213" cy="150" rx="12" ry="28" fill="none" stroke="#C49A4B" stroke-width="1.5"/>
  <path d="M 208 155 Q 202 160 205 170" fill="none" stroke="#C49A4B" stroke-width="1"/>

  <!-- Eyes -->
  <path d="M 125 130 Q 135 135 145 130" fill="none" stroke="#C49A4B" stroke-width="1.5" stroke-linecap="round"/>
  <circle cx="135" cy="132" r="2" fill="#C49A4B"/>
  <path d="M 155 130 Q 165 135 175 130" fill="none" stroke="#C49A4B" stroke-width="1.5" stroke-linecap="round"/>
  <circle cx="165" cy="132" r="2" fill="#C49A4B"/>

  <!-- Eyebrows -->
  <path d="M 120 115 Q 135 110 145 115" fill="none" stroke="#C49A4B" stroke-width="1" stroke-linecap="round"/>
  <path d="M 155 115 Q 165 110 180 115" fill="none" stroke="#C49A4B" stroke-width="1" stroke-linecap="round"/>

  <!-- Nose -->
  <line x1="150" y1="135" x2="150" y2="160" stroke="#C49A4B" stroke-width="1"/>
  <path d="M 148 160 Q 148 162 150 163" fill="none" stroke="#C49A4B" stroke-width="1"/>
  <path d="M 152 160 Q 152 162 150 163" fill="none" stroke="#C49A4B" stroke-width="1"/>

  <!-- Lips -->
  <path d="M 130 190 Q 150 205 170 190" fill="none" stroke="#C49A4B" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M 130 190 Q 150 200 170 190" fill="none" stroke="#C49A4B" stroke-width="1" stroke-linecap="round"/>

  <!-- Cheekbone definition lines -->
  <path d="M 110 155 Q 120 165 130 175" fill="none" stroke="#C49A4B" stroke-width="0.8" opacity="0.6"/>
  <path d="M 190 155 Q 180 165 170 175" fill="none" stroke="#C49A4B" stroke-width="0.8" opacity="0.6"/>

  <!-- LYMPHATIC DRAINAGE PATHWAYS (dashed lines) -->

  <!-- Forehead to temple nodes -->
  <path d="M 140 100 Q 120 105 95 120" fill="none" stroke="#C49A4B" stroke-width="1.2" stroke-dasharray="2,2" opacity="0.8"/>
  <path d="M 150 100 Q 130 105 105 125" fill="none" stroke="#C49A4B" stroke-width="1.2" stroke-dasharray="2,2" opacity="0.8"/>
  <path d="M 160 100 Q 175 105 195 120" fill="none" stroke="#C49A4B" stroke-width="1.2" stroke-dasharray="2,2" opacity="0.8"/>
  <path d="M 170 100 Q 190 105 215 125" fill="none" stroke="#C49A4B" stroke-width="1.2" stroke-dasharray="2,2" opacity="0.8"/>

  <!-- Eyes/Upper cheek to temple nodes -->
  <path d="M 130 130 Q 115 130 100 135" fill="none" stroke="#C49A4B" stroke-width="1.2" stroke-dasharray="2,2" opacity="0.8"/>
  <path d="M 170 130 Q 185 130 200 135" fill="none" stroke="#C49A4B" stroke-width="1.2" stroke-dasharray="2,2" opacity="0.8"/>

  <!-- Cheeks outward to temple nodes -->
  <path d="M 125 160 Q 110 160 95 155" fill="none" stroke="#C49A4B" stroke-width="1.2" stroke-dasharray="2,2" opacity="0.8"/>
  <path d="M 175 160 Q 190 160 205 155" fill="none" stroke="#C49A4B" stroke-width="1.2" stroke-dasharray="2,2" opacity="0.8"/>

  <!-- Nose and center face to mandibular nodes (behind jaw) -->
  <path d="M 145 150 Q 140 165 120 185" fill="none" stroke="#C49A4B" stroke-width="1.2" stroke-dasharray="2,2" opacity="0.8"/>
  <path d="M 155 150 Q 160 165 180 185" fill="none" stroke="#C49A4B" stroke-width="1.2" stroke-dasharray="2,2" opacity="0.8"/>

  <!-- Lower face/jaw to submental and mandibular nodes -->
  <path d="M 135 210 Q 125 225 110 240" fill="none" stroke="#C49A4B" stroke-width="1.2" stroke-dasharray="2,2" opacity="0.8"/>
  <path d="M 150 215 Q 150 230 145 250" fill="none" stroke="#C49A4B" stroke-width="1.2" stroke-dasharray="2,2" opacity="0.8"/>
  <path d="M 165 210 Q 175 225 190 240" fill="none" stroke="#C49A4B" stroke-width="1.2" stroke-dasharray="2,2" opacity="0.8"/>

  <!-- Neck drainage downward -->
  <path d="M 145 255 Q 140 275 135 295" fill="none" stroke="#C49A4B" stroke-width="1.2" stroke-dasharray="2,2" opacity="0.8"/>
  <path d="M 155 255 Q 160 275 165 295" fill="none" stroke="#C49A4B" stroke-width="1.2" stroke-dasharray="2,2" opacity="0.8"/>

  <!-- LYMPH NODE LOCATIONS (small dots at node sites) -->

  <!-- Right temple/ear node -->
  <circle cx="95" cy="120" r="3.5" fill="none" stroke="#C49A4B" stroke-width="1.2"/>
  <circle cx="95" cy="120" r="1.5" fill="#C49A4B"/>
  <text x="95" y="105" class="label-text" font-size="9">Node</text>

  <!-- Left temple/ear node -->
  <circle cx="205" cy="120" r="3.5" fill="none" stroke="#C49A4B" stroke-width="1.2"/>
  <circle cx="205" cy="120" r="1.5" fill="#C49A4B"/>
  <text x="205" y="105" class="label-text" font-size="9">Node</text>

  <!-- Behind right ear (post-auricular) -->
  <circle cx="220" cy="145" r="3.5" fill="none" stroke="#C49A4B" stroke-width="1.2"/>
  <circle cx="220" cy="145" r="1.5" fill="#C49A4B"/>

  <!-- Behind left ear (post-auricular) -->
  <circle cx="80" cy="145" r="3.5" fill="none" stroke="#C49A4B" stroke-width="1.2"/>
  <circle cx="80" cy="145" r="1.5" fill="#C49A4B"/>

  <!-- Right mandibular node (below jawline) -->
  <circle cx="190" cy="210" r="3.5" fill="none" stroke="#C49A4B" stroke-width="1.2"/>
  <circle cx="190" cy="210" r="1.5" fill="#C49A4B"/>
  <text x="190" y="225" class="label-text" font-size="9">Node</text>

  <!-- Left mandibular node (below jawline) -->
  <circle cx="110" cy="210" r="3.5" fill="none" stroke="#C49A4B" stroke-width="1.2"/>
  <circle cx="110" cy="210" r="1.5" fill="#C49A4B"/>
  <text x="110" y="225" class="label-text" font-size="9">Node</text>

  <!-- Submental node (center under chin) -->
  <circle cx="150" cy="230" r="3.5" fill="none" stroke="#C49A4B" stroke-width="1.2"/>
  <circle cx="150" cy="230" r="1.5" fill="#C49A4B"/>

  <!-- Right cervical chain nodes (neck) -->
  <circle cx="170" cy="270" r="3.5" fill="none" stroke="#C49A4B" stroke-width="1.2"/>
  <circle cx="170" cy="270" r="1.5" fill="#C49A4B"/>

  <!-- Left cervical chain nodes (neck) -->
  <circle cx="130" cy="270" r="3.5" fill="none" stroke="#C49A4B" stroke-width="1.2"/>
  <circle cx="130" cy="270" r="1.5" fill="#C49A4B"/>

  <!-- Lower neck nodes -->
  <circle cx="145" cy="310" r="3.5" fill="none" stroke="#C49A4B" stroke-width="1.2"/>
  <circle cx="145" cy="310" r="1.5" fill="#C49A4B"/>
  <circle cx="165" cy="310" r="3.5" fill="none" stroke="#C49A4B" stroke-width="1.2"/>
  <circle cx="165" cy="310" r="1.5" fill="#C49A4B"/>

  <!-- Legend indicator -->
  <text x="150" y="370" class="label-text" font-size="10" opacity="0.7">Dashed paths show lymphatic drainage | Dots indicate lymph node locations</text>
</svg>